<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Net Worth Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0b0d10; }

    :root {
      --bg:        #0b0d10;
      --surface:   #13161a;
      --surface2:  #1a1f26;
      --border:    #21262d;
      --text:      #e6edf3;
      --muted:     #7d8590;
      --green:     #3fb950;
      --green-dim: #1a4d26;
      --green-glow:rgba(63,185,80,0.15);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 4px; }

    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #2d333b; }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
    }

    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    .btn-green {
      background: var(--green);
      color: #000;
      font-weight: 600;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      transition: opacity 0.1s;
      white-space: nowrap;
    }
    .btn-green:hover { opacity: 0.85; }

    .btn-ghost {
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: color 0.1s, border-color 0.1s;
    }
    .btn-ghost:hover { color: var(--text); border-color: #2d333b; }

    .dark-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 6px 10px;
      width: 100%;
      transition: border-color 0.15s;
    }
    .dark-input::placeholder { color: #4b5563; }
    .dark-input:focus { outline: none; border-color: var(--green); }

    .divider { height: 1px; background: var(--border); }

    .pill-green {
      background: var(--green-dim);
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .modal-bg {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body class="min-h-screen" style="color:#e6edf3;">

<!-- Nav -->
<nav style="background:#0b0d10; border-bottom:1px solid #21262d;" class="px-6 py-3 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <div style="background:var(--green); width:28px; height:28px; border-radius:7px;" class="flex items-center justify-center">
      <svg width="14" height="14" fill="none" stroke="#000" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
      </svg>
    </div>
    <span style="font-weight:600; font-size:15px; color:#e6edf3;">Wealth</span>
  </div>

  <div class="flex items-center gap-3">
    <span id="lastUpdated" style="font-size:11px; color:var(--muted);"></span>
    <button onclick="openSnapshot()" class="btn-green flex items-center gap-1.5">
      <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      Save Snapshot
    </button>
  </div>
</nav>

<!-- Main -->
<main style="max-width:980px;" class="mx-auto px-4 py-8">

  <!-- Hero Net Worth -->
  <div class="card p-6 mb-6" style="background: linear-gradient(135deg, #13161a 0%, #141c15 100%);">
    <div class="flex items-start justify-between flex-wrap gap-4">
      <div>
        <p style="font-size:11px; color:var(--muted); letter-spacing:0.08em; font-weight:500;" class="mb-2">TOTAL NET WORTH</p>
        <p id="totalNetWorth" class="num" style="font-size:48px; font-weight:700; color:var(--green); line-height:1;">$0</p>
      </div>
      <div class="flex gap-6 flex-wrap" style="margin-top:4px;">
        <div>
          <p style="font-size:10px; color:var(--muted); letter-spacing:0.06em;" class="mb-1">LIQUID</p>
          <p id="totalLiquid" class="num" style="font-size:18px; font-weight:600; color:var(--text);">$0</p>
        </div>
        <div>
          <p style="font-size:10px; color:var(--muted); letter-spacing:0.06em;" class="mb-1">INVESTMENTS</p>
          <p id="totalInvestments" class="num" style="font-size:18px; font-weight:600; color:var(--text);">$0</p>
        </div>
        <div>
          <p style="font-size:10px; color:var(--muted); letter-spacing:0.06em;" class="mb-1">RETIREMENT</p>
          <p id="totalRetirement" class="num" style="font-size:18px; font-weight:600; color:var(--text);">$0</p>
        </div>
        <div>
          <p style="font-size:10px; color:var(--muted); letter-spacing:0.06em;" class="mb-1">HSA</p>
          <p id="totalHSA" class="num" style="font-size:18px; font-weight:600; color:var(--text);">$0</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Accounts + Chart row -->
  <div class="grid gap-4" style="grid-template-columns: 1fr 280px;">

    <!-- Accounts Table -->
    <div class="card overflow-hidden">
      <div class="px-5 py-4 flex items-center justify-between">
        <p style="font-size:11px; color:var(--muted); letter-spacing:0.08em; font-weight:500;">ACCOUNTS</p>
        <span class="tag">6 accounts</span>
      </div>
      <div class="divider"></div>

      <!-- Table header -->
      <div class="px-5 py-2 grid" style="grid-template-columns:1fr 130px 130px; gap:8px;">
        <p style="font-size:11px; color:var(--muted); font-weight:500;">Account</p>
        <p style="font-size:11px; color:var(--muted); font-weight:500; text-align:right;">Balance</p>
        <p style="font-size:11px; color:var(--muted); font-weight:500; text-align:right;">Update</p>
      </div>
      <div class="divider"></div>

      <!-- Rows -->
      <div id="accountRows"></div>
    </div>

    <!-- Right column: Chart + History -->
    <div class="flex flex-col gap-4">

      <!-- Donut Chart -->
      <div class="card p-5">
        <p style="font-size:11px; color:var(--muted); letter-spacing:0.08em; font-weight:500;" class="mb-4">ALLOCATION</p>
        <div class="flex justify-center mb-4">
          <div style="width:160px;height:160px; position:relative;">
            <canvas id="allocationChart"></canvas>
            <div id="chartCenter" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;">
              <p style="font-size:9px;color:var(--muted);">NET WORTH</p>
              <p id="chartCenterVal" class="num" style="font-size:14px;font-weight:700;color:var(--green);">$0</p>
            </div>
          </div>
        </div>
        <div id="chartLegend" class="space-y-2"></div>
      </div>

      <!-- Snapshot History -->
      <div class="card p-5 flex-1">
        <div class="flex items-center justify-between mb-4">
          <p style="font-size:11px; color:var(--muted); letter-spacing:0.08em; font-weight:500;">HISTORY</p>
          <button onclick="clearHistory()" style="font-size:11px; color:#6b7280;" class="hover:text-red-400 transition-colors">clear</button>
        </div>
        <div id="historyList" style="max-height:200px; overflow-y:auto;" class="space-y-1"></div>
      </div>

    </div>
  </div>

</main>

<!-- Snapshot Modal -->
<div id="snapshotModal" class="fixed inset-0 modal-bg flex items-center justify-center z-50 hidden">
  <div class="card p-6 w-72 shadow-2xl" style="border-color:#2d333b;">
    <p style="font-weight:600; font-size:15px; color:var(--text);" class="mb-1">Save Snapshot</p>
    <p style="font-size:12px; color:var(--muted);" class="mb-5">Record today's net worth to track your progress over time.</p>
    <div class="mb-5 rounded-lg p-4 text-center" style="background:var(--green-dim); border:1px solid var(--green-dim);">
      <p style="font-size:10px; color:var(--green); letter-spacing:0.06em;" class="mb-1">NET WORTH</p>
      <p id="modalNetWorth" class="num" style="font-size:28px; font-weight:700; color:var(--green);">$0</p>
    </div>
    <div class="flex gap-2">
      <button onclick="closeSnapshot()" class="btn-ghost flex-1">Cancel</button>
      <button onclick="confirmSnapshot()" class="btn-green flex-1 text-center">Save</button>
    </div>
  </div>
</div>

<script>
const ACCOUNTS = ['checking','savings','brokerage','401k1','401k2','hsa'];
const META = {
  checking:  { label: 'Checking',            sub: 'Liquid · Cash',                cat: 'liquid' },
  savings:   { label: 'Savings',             sub: 'Liquid · Cash',                cat: 'liquid' },
  brokerage: { label: 'Brokerage',           sub: 'Investment · Taxable',         cat: 'investments' },
  '401k1':   { label: '401(k) — Primary',    sub: 'Retirement · Tax-deferred',    cat: 'retirement' },
  '401k2':   { label: '401(k) — Prior Employer', sub: 'Retirement · Tax-deferred', cat: 'retirement' },
  hsa:       { label: 'HSA',                 sub: 'Health · Triple tax-advantaged', cat: 'hsa' },
};

const CAT_COLORS = {
  liquid:      '#3fb950',
  investments: '#58a6ff',
  retirement:  '#f0883e',
  hsa:         '#a371f7',
};

let chart = null;

function loadData() {
  const raw = localStorage.getItem('nwt_balances');
  return raw ? JSON.parse(raw) : {};
}

function saveData(data) {
  data._updated = new Date().toISOString();
  localStorage.setItem('nwt_balances', JSON.stringify(data));
}

function fmt(n) {
  return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 }).format(n || 0);
}

function buildAccountRows() {
  const container = document.getElementById('accountRows');
  container.innerHTML = ACCOUNTS.map((key, i) => {
    const m = META[key];
    const color = CAT_COLORS[m.cat];
    return `
      <div class="${i < ACCOUNTS.length-1 ? 'border-b' : ''}" style="border-color:#21262d;">
        <div class="px-5 py-3 grid items-center" style="grid-template-columns:1fr 130px 130px; gap:8px;">
          <div class="flex items-center gap-3">
            <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></div>
            <div>
              <p style="font-size:13px;font-weight:500;color:#e6edf3;">${m.label}</p>
              <p style="font-size:11px;color:var(--muted);">${m.sub}</p>
            </div>
          </div>
          <p id="val-${key}" class="num" style="font-size:15px;font-weight:600;color:#e6edf3;text-align:right;">$0</p>
          <div class="flex gap-1.5 justify-end">
            <input id="input-${key}" type="number" placeholder="0" class="dark-input" style="width:90px;text-align:right;"/>
            <button onclick="saveAccount('${key}')" class="btn-green">Set</button>
          </div>
        </div>
      </div>`;
  }).join('');

  ACCOUNTS.forEach(key => {
    document.getElementById('input-'+key).addEventListener('keydown', e => {
      if (e.key === 'Enter') saveAccount(key);
    });
  });
}

function saveAccount(key) {
  const input = document.getElementById('input-'+key);
  const val = parseFloat(input.value);
  if (isNaN(val)) return;
  const data = loadData();
  data[key] = val;
  saveData(data);
  input.value = '';
  render();
}

function render() {
  const data = loadData();
  let liquid=0, investments=0, retirement=0, hsa=0;

  ACCOUNTS.forEach(key => {
    const v = data[key] || 0;
    const el = document.getElementById('val-'+key);
    if (el) el.textContent = fmt(v);
    const cat = META[key].cat;
    if (cat==='liquid') liquid+=v;
    else if (cat==='investments') investments+=v;
    else if (cat==='retirement') retirement+=v;
    else if (cat==='hsa') hsa+=v;
  });

  const total = liquid+investments+retirement+hsa;
  document.getElementById('totalNetWorth').textContent = fmt(total);
  document.getElementById('totalLiquid').textContent = fmt(liquid);
  document.getElementById('totalInvestments').textContent = fmt(investments);
  document.getElementById('totalRetirement').textContent = fmt(retirement);
  document.getElementById('totalHSA').textContent = fmt(hsa);
  document.getElementById('chartCenterVal').textContent = fmt(total);

  if (data._updated) {
    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date(data._updated).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }

  renderChart(liquid, investments, retirement, hsa, total);
  renderHistory();
}

function renderChart(liquid, investments, retirement, hsa, total) {
  const labels = ['Liquid','Investments','Retirement','HSA'];
  const values = [liquid, investments, retirement, hsa];
  const colors = [CAT_COLORS.liquid, CAT_COLORS.investments, CAT_COLORS.retirement, CAT_COLORS.hsa];
  const ctx = document.getElementById('allocationChart').getContext('2d');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: total === 0 ? [1,0,0,0] : values,
        backgroundColor: total === 0 ? ['#21262d','#21262d','#21262d','#21262d'] : colors,
        borderWidth: 2,
        borderColor: '#13161a',
        hoverBorderColor: '#13161a',
      }]
    },
    options: {
      cutout: '72%',
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: total > 0,
          callbacks: { label: c => ` ${fmt(c.raw)} (${total?(c.raw/total*100).toFixed(1):0}%)` }
        }
      },
      animation: { duration: 300 }
    }
  });

  const legend = document.getElementById('chartLegend');
  legend.innerHTML = labels.map((l,i) => `
    <div class="flex items-center justify-between" style="padding:3px 0;">
      <div class="flex items-center gap-2">
        <div style="width:8px;height:8px;border-radius:50%;background:${colors[i]};flex-shrink:0;"></div>
        <span style="font-size:12px;color:#7d8590;">${l}</span>
      </div>
      <span class="num" style="font-size:12px;font-weight:500;color:#e6edf3;">${total?(values[i]/total*100).toFixed(1):0}%</span>
    </div>`).join('');
}

function renderHistory() {
  const raw = localStorage.getItem('nwt_history');
  const history = raw ? JSON.parse(raw) : [];
  const el = document.getElementById('historyList');

  if (history.length === 0) {
    el.innerHTML = `<p style="font-size:12px;color:#4b5563;font-style:italic;">No snapshots yet.</p>`;
    return;
  }

  el.innerHTML = [...history].reverse().map((s, i) => {
    const idx = history.length - 1 - i;
    const prev = history[idx - 1];
    const delta = prev ? s.total - prev.total : null;
    const deltaStr = delta !== null
      ? `<span class="num" style="font-size:11px;font-weight:600;color:${delta>=0?'#3fb950':'#f85149'};">${delta>=0?'+':''}${fmt(delta)}</span>`
      : '<span style="font-size:11px;color:#4b5563;">—</span>';
    return `
      <div class="flex items-center justify-between" style="padding:5px 0;border-bottom:1px solid #1a1f26;">
        <div>
          <p class="num" style="font-size:13px;font-weight:500;color:#e6edf3;">${fmt(s.total)}</p>
          <p style="font-size:11px;color:#4b5563;">${new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</p>
        </div>
        ${deltaStr}
      </div>`;
  }).join('');
}

function openSnapshot() {
  const data = loadData();
  const total = ACCOUNTS.reduce((s,k) => s+(data[k]||0), 0);
  document.getElementById('modalNetWorth').textContent = fmt(total);
  document.getElementById('snapshotModal').classList.remove('hidden');
}

function closeSnapshot() {
  document.getElementById('snapshotModal').classList.add('hidden');
}

function confirmSnapshot() {
  const data = loadData();
  const total = ACCOUNTS.reduce((s,k) => s+(data[k]||0), 0);
  const raw = localStorage.getItem('nwt_history');
  const history = raw ? JSON.parse(raw) : [];
  history.push({ date: new Date().toISOString(), total, accounts: {...data} });
  localStorage.setItem('nwt_history', JSON.stringify(history));
  closeSnapshot();
  renderHistory();
}

function clearHistory() {
  if (!confirm('Delete all snapshot history?')) return;
  localStorage.removeItem('nwt_history');
  renderHistory();
}

buildAccountRows();
render();
</script>
</body>
</html>
